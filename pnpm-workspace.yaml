packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed to run install/postinstall scripts (pnpm blocks these by default).
allowBuilds:
  esbuild: true
  "@swc/core": true
  sharp: true
  "unrs-resolver": true
  "@tailwindcss/oxide": true
  "mongodb-memory-server": true
  # only a Node-version check (the server runs Node 22) — not needed
  "@whiskeysockets/baileys": false
  # a notice about its optional command-line tools — not needed
  protobufjs: false
